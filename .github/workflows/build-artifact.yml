# build-artifact.yml — Coba core lain TANPA menimpa Release.
#
# CARA PAKAI (di GitHub WebUI):
#   Repo -> Actions -> build-artifact -> Run workflow
#   -> pilih "Core sing-box" dari dropdown -> Run workflow.
#
# HASIL: BUKAN Release. Hasil build masuk ke Actions Artifact
# (di halaman run itu sendiri, bagian Artifacts, di bawah).
# Nama artifact: taptapbox-go-singbox-<versi-core>
#   contoh: taptapbox-go-singbox-1.14.2
# Isinya: DUA zip modul Magisk SLIM siap flash (pilih sesuai HP):
#   taptapbox-go-v1.0.0-arm64.zip dan taptapbox-go-v1.0.0-v7a.zip
#
# PAKAI WORKFLOW INI UNTUK:
# - nyoba versi core lain (mis. 1.14.4, 1.14.2, 1.13.x),
# - sebelum memutuskan versi itu layak jadi Release v1.0.0.
# Release v1.0.0 TIDAK disentuh sama sekali oleh workflow ini.
# Bila versi yang dicoba sudah cocok, baru Run workflow "release"
# dengan versi yang sama — itulah yang menimpa Release v1.0.0.
#
# CORE: sama seperti workflow release — sing-box adalah library
# tertanam di biner taptapbox, jadi "pilih core" artinya membangun
# ulang modul dengan library sing-box versi pilihan. Bukan
# mengunduh core sendirian.
#
# RETENSI: artifact disimpan 90 hari (batas maksimal GitHub;
# bila repo/org membatasi lebih rendah, batas itu yang berlaku).
# Sesudah itu artifact hilang sendiri — jadi versi yang sudah
# diputuskan cocok sebaiknya segera dirilis lewat workflow release.
#
# DAFTAR 10 VERSI: sama seperti workflow release — daftar statis
# (10 versi stabil terakhir per 2026-10-28, tanpa alpha/beta/rc).
# Bila sing-box merilis versi stabil baru, tambah di paling atas
# di KEDUA workflow (release.yml dan file ini) dan buang yang
# paling bawah supaya tetap 10.

name: build-artifact

on:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: "Core sing-box untuk dicoba (10 versi stabil terakhir)"
        required: true
        default: "v1.14.4"
        type: choice
        options:
          - "v1.14.4"
          - "v1.14.3"
          - "v1.14.2"
          - "v1.14.1"
          - "v1.14.0"
          - "v1.13.21"
          - "v1.13.20"
          - "v1.13.19"
          - "v1.13.18"
          - "v1.13.17"

permissions:
  contents: read
  actions: write

run-name: "TaptapBox-Go coba sing-box ${{ inputs.singbox_version }} (artifact)"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - name: Normalisasi versi
        run: |
          CORE_TAG="${{ inputs.singbox_version }}"
          case "$CORE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "versi tidak valid: $CORE_TAG (harus vX.Y.Z)"; exit 1 ;;
          esac
          CORE_VER="${CORE_TAG#v}"
          MODULE_VER="$(grep -E '^version=' module/module.prop | cut -d= -f2)"
          [ -n "$MODULE_VER" ] || { echo "version= tidak ada di module.prop"; exit 1; }
          {
            echo "CORE_TAG=$CORE_TAG"
            echo "CORE_VER=$CORE_VER"
            echo "MODULE_VER=$MODULE_VER"
            echo "ASSET=taptapbox-go-${MODULE_VER}-singbox-${CORE_VER}.zip"
          } >> "$GITHUB_ENV"
          echo "modul=$MODULE_VER core=$CORE_TAG aset=$ASSET"

      - name: Terapkan versi core ke source
        run: |
          # Hapus replace lokal (path mesin pembuat) supaya Go proxy
          # yang dipakai, bukan source sing-box lokal.
          sed -i '/replace github.com\/sagernet\/sing-box/d' backend/go.mod
          # Konstanta versi library (dipakai WebUI + fallback deteksi).
          sed -i "s/const singboxLibraryVersion = \".*\"/const singboxLibraryVersion = \"$CORE_VER\"/" backend/singboxlib.go
          grep -F "const singboxLibraryVersion = \"$CORE_VER\"" backend/singboxlib.go
          # Fallback teks di WebUI + pesan install. Bila default di
          # repo sudah berubah dari 1.14.3, baris ini tidak menemukan
          # apa-apa dan tidak masalah (|| true).
          sed -i "s/'1.14.3'/'$CORE_VER'/g" webui/app.js || true
          sed -i "s/sing-box library 1.14.3/sing-box library $CORE_VER/" module/customize.sh || true
          # Ganti dependency library + rapikan go.mod/go.sum.
          (cd backend && go mod edit -require="github.com/sagernet/sing-box@$CORE_TAG" && go mod tidy)
          grep -E '^require github.com/sagernet/sing-box ' backend/go.mod || grep 'sagernet/sing-box' backend/go.mod | head -3

      - name: vet + tes (gagal di sini = tidak ada artifact)
        run: |
          (cd backend && go vet -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api" ./...)
          (cd backend && go test -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api" ./...)

      - name: Cek NDK v7a (wajib, jangan sampai v7a diam-diam dilewati)
        run: |
          CLANG="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          [ -x "$CLANG" ] || { echo "NDK clang v7a tidak ditemukan: $CLANG"; exit 1; }
          echo "NDK v7a OK: $CLANG"

      - name: Build modul SLIM (arm64 + v7a)
        run: |
          sh build.sh
          ls -la dist/
          cp "dist/taptapbox-$MODULE_VER-arm64.zip" "dist/taptapbox-go-$MODULE_VER-arm64.zip"
          cp "dist/taptapbox-$MODULE_VER-v7a.zip" "dist/taptapbox-go-$MODULE_VER-v7a.zip"
          ls -la "dist/taptapbox-go-$MODULE_VER-arm64.zip" "dist/taptapbox-go-$MODULE_VER-v7a.zip"

      - name: Verifikasi isi kedua zip
        run: |
          unzip -l "dist/taptapbox-go-$MODULE_VER-arm64.zip" | grep -E 'bin/arm64/taptapbox$|module.prop$'
          unzip -p "dist/taptapbox-go-$MODULE_VER-arm64.zip" module.prop | grep -E "^version=$MODULE_VER$"
          unzip -l "dist/taptapbox-go-$MODULE_VER-v7a.zip" | grep -E 'bin/armv7/taptapbox$|module.prop$'
          unzip -p "dist/taptapbox-go-$MODULE_VER-v7a.zip" module.prop | grep -E "^version=$MODULE_VER$"

      - name: Upload ke Artifact (bukan Release)
        uses: actions/upload-artifact@v4
        with:
          name: taptapbox-go-singbox-${{ env.CORE_VER }}
          path: |
            dist/taptapbox-go-${{ env.MODULE_VER }}-arm64.zip
            dist/taptapbox-go-${{ env.MODULE_VER }}-v7a.zip
          retention-days: 90
          if-no-files-found: error
