# release.yml — GitHub Release TaptapBox-Go, SATU rilis saja.
#
# CARA PAKAI (di GitHub WebUI, sama seperti TaptapApp kemarin):
#   Repo -> Actions -> release -> Run workflow
#   -> pilih "Core sing-box" dari dropdown -> Run workflow.
#
# HASIL: satu Release, tag = versi module.prop (v1.0.0), judul
# "TaptapBox-Go v1.0.0", aset HANYA zip install
# (taptapbox-go-v1.0.0.zip, modul Magisk SLIM siap flash).
# Run ulang menimpa Release v1.0.0 itu, bukan membuat rilis baru.
#
# PENOMORAN (sama seperti TaptapApp kemarin):
# Paket GitHub ini dinomori ulang ke v1.0.0 / versionCode 1, padahal
# fungsi = TaptapBox lokal v1.1.0. Yang TIDAK berubah: id modul
# (taptapbox), data (/data/adb/taptapbox), port WebUI (5056), dan
# path WebUI (/taptapbox/) — jadi flash timpa (tanpa uninstall)
# tidak menghapus data/config. Catatan jujur: versionCode turun
# 2 -> 1, jadi Magisk bisa menganggap ini downgrade, tapi flash
# manual timpa tetap jalan.
#
# CORE: sing-box di TaptapBox adalah LIBRARY tertanam di biner
# taptapbox, bukan biner terpisah. Jadi "pilih core" di sini artinya
# membangun ulang modul dengan library sing-box versi pilihan, lalu
# merilis modul utuh itu. Bukan mengunduh core sendirian.
#
# REKOMENDASI CORE (per 2026-10-28):
# - v1.14.4 = versi terbaru yang SUDAH TERBUKTI cocok dengan
#   TaptapBox ini (simulasi lokal: go mod tidy + vet + tes + build
#   SLIM lolos semua).
# - v1.14.3 = versi bawaan sekarang, paling aman bila tidak mau
#   pindah core dulu. Ini pilihan yang direncanakan pembuat untuk
#   rilis v1.0.0 ini.
# Versi lain di dropdown belum terbukti compile dengan kode
# TaptapBox sekarang; bila gagal, workflow berhenti SEBELUM rilis
# dibuat. Mau versi lain? Fork repo ini, lalu Run workflow sendiri.
#
# DAFTAR 10 VERSI: GitHub tidak bisa membuat dropdown workflow
# yang terisi otomatis dari rilis terbaru — daftar options di bawah
# STATIS (10 versi stabil terakhir per 2026-10-28, tanpa alpha/beta/rc).
# Bila sing-box merilis versi stabil baru, tambah di paling atas
# dan buang yang paling bawah supaya tetap 10.

name: release

on:
  workflow_dispatch:
    inputs:
      singbox_version:
        description: "Core sing-box (10 versi stabil terakhir)"
        required: true
        default: "v1.14.4"
        type: choice
        options:
          - "v1.14.4"
          - "v1.14.3"
          - "v1.14.2"
          - "v1.14.1"
          - "v1.14.0"
          - "v1.13.21"
          - "v1.13.20"
          - "v1.13.19"
          - "v1.13.18"
          - "v1.13.17"

permissions:
  contents: write

run-name: "TaptapBox-Go + sing-box ${{ inputs.singbox_version }}"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: false

      - name: Normalisasi versi
        run: |
          CORE_TAG="${{ inputs.singbox_version }}"
          case "$CORE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "versi tidak valid: $CORE_TAG (harus vX.Y.Z)"; exit 1 ;;
          esac
          CORE_VER="${CORE_TAG#v}"
          MODULE_VER="$(grep -E '^version=' module/module.prop | cut -d= -f2)"
          [ -n "$MODULE_VER" ] || { echo "version= tidak ada di module.prop"; exit 1; }
          {
            echo "CORE_TAG=$CORE_TAG"
            echo "CORE_VER=$CORE_VER"
            echo "MODULE_VER=$MODULE_VER"
          } >> "$GITHUB_ENV"
          echo "modul=$MODULE_VER core=$CORE_TAG"

      - name: Terapkan versi core ke source
        run: |
          # Hapus replace lokal (path mesin pembuat) supaya Go proxy
          # yang dipakai, bukan source sing-box lokal.
          sed -i '/replace github.com\/sagernet\/sing-box/d' backend/go.mod
          # Konstanta versi library (dipakai WebUI + fallback deteksi).
          sed -i "s/const singboxLibraryVersion = \".*\"/const singboxLibraryVersion = \"$CORE_VER\"/" backend/singboxlib.go
          grep -F "const singboxLibraryVersion = \"$CORE_VER\"" backend/singboxlib.go
          # Fallback teks di WebUI + pesan install. Bila default di
          # repo sudah berubah dari 1.14.3, baris ini tidak menemukan
          # apa-apa dan tidak masalah (|| true).
          sed -i "s/'1.14.3'/'$CORE_VER'/g" webui/app.js || true
          sed -i "s/sing-box library 1.14.3/sing-box library $CORE_VER/" module/customize.sh || true
          # Ganti dependency library + rapikan go.mod/go.sum.
          (cd backend && go mod edit -require="github.com/sagernet/sing-box@$CORE_TAG" && go mod tidy)
          grep -E '^require github.com/sagernet/sing-box ' backend/go.mod || grep 'sagernet/sing-box' backend/go.mod | head -3

      - name: vet + tes (gagal di sini = tidak ada rilis)
        run: |
          (cd backend && go vet -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api" ./...)
          (cd backend && go test -tags "with_gvisor,with_quic,with_dhcp,with_wireguard,with_utls,with_acme,with_clash_api" ./...)

      - name: Build modul SLIM
        run: |
          sh build.sh
          ls -la dist/
          cp "dist/taptapbox-$MODULE_VER.zip" "dist/taptapbox-go-$MODULE_VER.zip"
          ls -la "dist/taptapbox-go-$MODULE_VER.zip"

      - name: Verifikasi isi zip
        run: |
          unzip -l "dist/taptapbox-go-$MODULE_VER.zip" | grep -E 'bin/arm64/taptapbox$|module.prop$'
          unzip -p "dist/taptapbox-go-$MODULE_VER.zip" module.prop | grep -E "^version=$MODULE_VER$"

      - name: Terbitkan Release v1.0.0 (timpa bila sudah ada)
        run: |
          gh release delete "$MODULE_VER" --yes || true
          gh release create "$MODULE_VER" "dist/taptapbox-go-$MODULE_VER.zip" \
            --title "TaptapBox-Go $MODULE_VER" \
            --notes "Modul TaptapBox-Go $MODULE_VER (fungsi = TaptapBox lokal v1.1.0, dinomori ulang ke v1.0.0 untuk rilis GitHub) dengan library sing-box $CORE_VER tertanam di dalam biner taptapbox.

          Cara pakai: flash zip ini di Magisk timpa instalasi lama (tanpa uninstall supaya data/config tidak hilang), reboot, lalu cek WebUI Tentang -> Core sing-box (library) harus menunjukkan $CORE_VER. Geodata, zashboard, dan scrcpy tetap diunduh lewat Tentang -> Download sesudah reboot bila belum terpasang.

          id modul, data, port 5056, dan path WebUI tidak berubah dari TaptapBox lokal. Mau core versi lain? Fork repo ini, lalu Run workflow sendiri dan pilih versinya."
