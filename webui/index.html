<!-- App bar -->
<header id="appbar">
  <button class="abtn" id="btnDrawer"><svg class="ic solo" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button>
  <span id="title">TaptapBox</span>
  <span class="sp"></span>
  <button class="abtn" id="btnSearch" title="Cari"><svg class="ic solo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button>
  <button class="abtn" id="btnAdd" title="Tambah"><svg class="ic solo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  <button class="abtn" id="btnMore" title="Lainnya"><svg class="ic solo" viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></g></svg></button>
</header>
<div id="searchBar" class="hidden"><input id="searchInput" placeholder="Cari server…"></div>

<!-- Drawer -->
<div id="scrim" class="hidden"></div>
<nav id="drawer">
  <div class="dhead"><span class="dlogo"><svg class="ic solo" viewBox="0.8 0.6 22.4 22.4" aria-hidden="true"><use href="#cklogo"/></svg></span><div><div>TaptapBox</div><div class="dver" id="dver"></div></div></div>
  <button data-view="servers"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2.5"/><path d="M8 20h8M12 16v4"/></svg>Konfigurasi</button>
  <button data-view="groups"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14a5 5 0 0 1 4 5"/></svg>Grup</button>
  <button data-view="routes"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>Rute</button>
  <button data-view="settings"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>Pengaturan</button>
  <button data-view="config"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5 3 12l5 7M16 5l5 7-5 7M13.5 4l-3 16"/></svg>Config</button>
  <button data-view="logs"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 12h6M10 16h6"/></svg>Logs</button>
  <button data-view="layanan"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/></svg>Layanan</button>
  <button data-view="scrcpy"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/><path d="M10 8.5v4l4-2z" fill="currentColor" stroke="none"/></svg>Scrcpy</button>
  <button data-view="about"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/></svg>Tentang</button>
</nav>

<!-- Main -->
<main id="view"></main>

<!-- FAB connect -->
<button id="fab" title="Connect"><svg class="ic" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.5.86l10.2-6.4a1 1 0 0 0 0-1.72L9.5 4.74A1 1 0 0 0 8 5.6z"/></svg></button>

<div id="menu" class="popup hidden"></div>

<div id="modal" class="hidden"><div class="mbox">

  <div id="modalBody" class="mbody"></div>
</div></div>

      try { reg.update(); } catch (e) {}

      console.warn('SW gagal:', e);

}
