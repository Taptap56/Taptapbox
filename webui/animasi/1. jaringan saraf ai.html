<!DOCTYPE html>
<html lang="id" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Jaringan Saraf AI</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#07090d;overflow:hidden}
  #fxwrap{position:fixed;inset:0}
  #leaves-canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id="fxwrap"><canvas id="leaves-canvas"></canvas></div>
<script>
    const canvas = document.getElementById('leaves-canvas');
    const ctx = canvas.getContext('2d');
    const rnd = (a, b) => a + Math.random() * (b - a);
    const TAU = Math.PI * 2;
    let W = 0, H = 0;
    function resizeCanvas() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const box = canvas.parentElement;
        W = box.clientWidth || window.innerWidth;
        H = box.clientHeight || window.innerHeight;
        canvas.style.width = '100%';
        canvas.style.height = '100%';
        canvas.width = W * dpr;
        canvas.height = H * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    const density = () => Math.min(1, W / 900 + 0.4);

    // --- Bentuk partikel jatuh -------------------------------------------
    const shape = {
        leaf(s) {
            ctx.beginPath(); ctx.moveTo(0, -s);
            ctx.bezierCurveTo(s * .7, -s * .5, s * .7, s * .5, 0, s);
            ctx.bezierCurveTo(-s * .7, s * .5, -s * .7, -s * .5, 0, -s);
            ctx.fill();
            ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = .8;
            ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(0, s * 1.1); ctx.stroke();
        },
        petal(s) {
            ctx.beginPath(); ctx.moveTo(0, -s);
            ctx.bezierCurveTo(s, -s * .6, s * .9, s * .8, 0, s);
            ctx.bezierCurveTo(-s * .9, s * .8, -s, -s * .6, 0, -s);
            ctx.fill();
        },
        feather(s, dark) {
            ctx.beginPath(); ctx.moveTo(0, -s);
            ctx.bezierCurveTo(s * .38, -s * .6, s * .34, s * .4, 0, s);
            ctx.bezierCurveTo(-s * .34, s * .4, -s * .38, -s * .6, 0, -s);
            ctx.fill();
            ctx.strokeStyle = dark ? 'rgba(255,255,255,.7)' : 'rgba(70,90,130,.55)'; ctx.lineWidth = .9;
            ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(0, s * 1.25);
            for (let i = -2; i <= 2; i++) {
                const y = i * s * .28;
                ctx.moveTo(0, y); ctx.lineTo(s * .28, y - s * .2);
                ctx.moveTo(0, y); ctx.lineTo(-s * .28, y - s * .2);
            }
            ctx.stroke();
        }
    };

    function fall(o) {
        const n = Math.round(o.n * density());
        const mk = init => ({
            x: rnd(0, W), y: init ? rnd(-40, H) : rnd(-60, -10),
            s: rnd(o.s[0], o.s[1]), vy: rnd(o.vy[0], o.vy[1]), sw: rnd(o.sw[0], o.sw[1]),
            ph: rnd(0, TAU), sp: rnd(.012, .03), rot: rnd(0, TAU), vr: rnd(-.02, .02),
            fl: rnd(0, TAU), vf: rnd(.02, .06), a: rnd(.65, .95),
            c: o.pal[(Math.random() * o.pal.length) | 0]
        });
        const P = Array.from({ length: n }, () => mk(true));
        return dark => {
            for (const p of P) {
                p.y += p.vy; p.ph += p.sp; p.x += Math.sin(p.ph) * p.sw; p.rot += p.vr; p.fl += p.vf;
                if (p.y > H + 40) Object.assign(p, mk(false));
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot + Math.sin(p.ph) * .35);
                if (o.flip) ctx.scale(Math.cos(p.fl), 1);
                if (o.shadow && !dark) { ctx.shadowColor = 'rgba(60,80,120,.35)'; ctx.shadowBlur = 5; }
                ctx.globalAlpha = p.a; ctx.fillStyle = p.c;
                shape[o.shape](p.s, dark);
                ctx.restore();
            }
        };
    }

    function snow() {
        const P = Array.from({ length: Math.round(90 * density()) }, () => {
            const r = rnd(1, 3.8);
            return { x: rnd(0, W), y: rnd(0, H), r, vy: .4 + r * .28, ph: rnd(0, TAU) };
        });
        return dark => {
            ctx.fillStyle = dark ? '#fff' : '#7fb2f0';
            for (const p of P) {
                p.y += p.vy; p.ph += .015; p.x += Math.sin(p.ph) * .5 + .15;
                if (p.y > H + 5) { p.y = -5; p.x = rnd(0, W); }
                if (p.x > W + 5) p.x = -5;
                ctx.globalAlpha = .35 + p.r / 6;
                ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
            }
            ctx.globalAlpha = 1;
        };
    }

    function rain() {
        const mk = init => ({ x: rnd(0, W + 60), y: init ? rnd(-H, H) : rnd(-80, 0), l: rnd(10, 22), v: rnd(13, 20) });
        const P = Array.from({ length: Math.round(140 * density()) }, () => mk(true));
        const R = [];
        return dark => {
            ctx.strokeStyle = dark ? 'rgba(170,210,255,.55)' : 'rgba(40,100,190,.5)';
            ctx.lineWidth = 1.1; ctx.lineCap = 'round';
            ctx.beginPath();
            for (const p of P) {
                p.y += p.v; p.x -= p.v * .12;
                ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.l * .12, p.y - p.l);
                if (p.y > H) {
                    if (Math.random() < .35 && R.length < 30) R.push({ x: p.x, y: H - rnd(3, 40), r: 1, a: .5 });
                    Object.assign(p, mk(false));
                }
            }
            ctx.stroke();
            for (let i = R.length - 1; i >= 0; i--) {
                const q = R[i]; q.r += .5; q.a -= .02;
                if (q.a <= 0) { R.splice(i, 1); continue; }
                ctx.globalAlpha = q.a;
                ctx.beginPath(); ctx.ellipse(q.x, q.y, q.r * 2, q.r * .7, 0, 0, TAU); ctx.stroke();
            }
            ctx.globalAlpha = 1;
        };
    }

    function meteor() {
        const S = Array.from({ length: 55 }, () => ({ x: rnd(0, W), y: rnd(0, H * .8), r: rnd(.5, 1.4), ph: rnd(0, TAU) }));
        const M = [];
        return dark => {
            ctx.fillStyle = dark ? '#fff' : '#5a78c8';
            for (const s of S) {
                s.ph += .03; ctx.globalAlpha = .25 + .35 * Math.abs(Math.sin(s.ph));
                ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
            }
            if (M.length < 4 && Math.random() < .018) M.push({ x: rnd(W * .3, W * 1.1), y: rnd(-40, H * .3), vx: -rnd(7, 11), vy: rnd(4, 7), l: rnd(110, 190) });
            const c = dark ? '255,255,255' : '60,90,190';
            for (let i = M.length - 1; i >= 0; i--) {
                const m = M[i]; m.x += m.vx; m.y += m.vy;
                if (m.x < -250 || m.y > H + 250) { M.splice(i, 1); continue; }
                const d = Math.hypot(m.vx, m.vy), tx = m.x - m.vx / d * m.l, ty = m.y - m.vy / d * m.l;
                const g = ctx.createLinearGradient(m.x, m.y, tx, ty);
                g.addColorStop(0, 'rgba(' + c + ',.95)'); g.addColorStop(1, 'rgba(' + c + ',0)');
                ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 2; ctx.lineCap = 'round';
                ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(tx, ty); ctx.stroke();
                ctx.fillStyle = 'rgb(' + c + ')'; ctx.beginPath(); ctx.arc(m.x, m.y, 2.2, 0, TAU); ctx.fill();
            }
            ctx.globalAlpha = 1;
        };
    }

    function fireflies() {
        const P = Array.from({ length: Math.round(32 * density()) }, () => ({ x: rnd(0, W), y: rnd(0, H), a: rnd(0, TAU), v: rnd(.2, .6), ph: rnd(0, TAU), r: rnd(2, 4.5) }));
        return dark => {
            const c = dark ? '200,255,120' : '230,170,20';
            for (const p of P) {
                p.a += rnd(-.08, .08); p.x += Math.cos(p.a) * p.v; p.y += Math.sin(p.a) * p.v; p.ph += .03;
                if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10;
                if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
                const al = .25 + .6 * Math.abs(Math.sin(p.ph));
                const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
                g.addColorStop(0, 'rgba(' + c + ',' + al + ')'); g.addColorStop(1, 'rgba(' + c + ',0)');
                ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, TAU); ctx.fill();
            }
        };
    }

    function neural() {
        const N = Array.from({ length: Math.round(46 * density()) }, () => ({ x: rnd(0, W), y: rnd(0, H), vx: rnd(-.35, .35), vy: rnd(-.35, .35), r: rnd(1.2, 2.6), h: Math.random() }));
        return dark => {
            const c = dark ? '167,139,250' : '109,40,217', L = 120;
            for (const p of N) { p.x += p.vx; p.y += p.vy; if (p.x < 0 || p.x > W) p.vx *= -1; if (p.y < 0 || p.y > H) p.vy *= -1; }
            ctx.lineWidth = 1; ctx.globalAlpha = 1;
            for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
                const a = N[i], b = N[j], d = Math.hypot(a.x - b.x, a.y - b.y);
                if (d < L) { ctx.strokeStyle = 'rgba(' + c + ',' + (.38 * (1 - d / L)) + ')'; ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
            }
            for (const p of N) { ctx.fillStyle = p.h > .66 ? 'rgba(34,211,238,.95)' : p.h > .33 ? 'rgba(217,70,239,.95)' : 'rgba(' + c + ',.95)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill(); }
        };
    }

    function earth(missile) {
        const D2R = Math.PI / 180;
        // Daratan kasar (lon,lat) -> dipakai menyusun titik-titik benua
        const polys = [
            [[-168,66],[-140,70],[-95,72],[-80,70],[-62,60],[-55,50],[-67,45],[-76,35],[-81,25],[-97,26],[-97,18],[-88,15],[-80,8],[-92,14],[-105,20],[-117,32],[-124,40],[-125,49],[-135,58],[-150,60],[-165,62]],
            [[-80,8],[-62,11],[-50,0],[-35,-6],[-40,-22],[-48,-28],[-58,-38],[-66,-46],[-70,-54],[-75,-48],[-72,-30],[-70,-18],[-81,-5]],
            [[-10,36],[-9,43],[-2,48],[5,53],[10,57],[20,60],[30,70],[40,68],[40,55],[30,46],[28,41],[22,37],[12,38],[3,40]],
            [[-17,15],[-10,30],[-5,36],[10,37],[32,31],[43,12],[51,12],[40,-5],[40,-15],[35,-25],[20,-35],[12,-18],[9,-1],[5,5],[-8,5],[-17,12]],
            [[30,46],[40,55],[40,68],[60,73],[100,77],[140,72],[170,68],[160,58],[142,52],[135,35],[122,30],[120,22],[108,10],[100,3],[98,15],[90,22],[80,10],[73,20],[67,25],[57,25],[50,30],[36,36],[30,40]],
            [[35,30],[43,13],[52,16],[58,22],[56,26],[50,30]],
            [[114,-22],[122,-18],[131,-12],[142,-11],[146,-19],[153,-27],[150,-37],[140,-38],[130,-32],[115,-34]],
            [[-55,60],[-45,60],[-20,70],[-20,82],[-60,82],[-70,76]],
            // --- pulau & semenanjung tambahan (Indonesia, Filipina, Jepang, dll.)
            [[95.3,5.5],[97.5,5.2],[100.5,2.5],[103.5,-.5],[106,-3],[105.8,-5.9],[103,-5],[100,-2],[98,.5],[95.8,3.2]],
            [[105.2,-6.8],[106.5,-6],[108.5,-6.5],[111,-6.4],[114.5,-7.7],[114,-8.7],[110,-8.2],[106.5,-7.5]],
            [[109,1.5],[111,2.5],[113,3.2],[116,6.9],[119,5.2],[118.5,1.5],[117.5,-1],[116,-3.8],[114,-4],[111,-3.5],[110,-1.5],[109.2,-.5]],
            [[119.5,-5.5],[120,-3],[119,-.5],[120.5,1.2],[124.8,1.5],[125,.8],[121.8,.3],[123.3,-.8],[121.6,-1.8],[123,-3.8],[122,-5],[120.5,-5.6]],
            [[131,-.8],[134,-.8],[138,-1.7],[141,-2.6],[145,-4.5],[147.5,-6.2],[150.5,-10.5],[147,-10],[143.5,-8.2],[141,-9.1],[138,-8.2],[137,-5],[134,-4],[132.5,-3]],
            [[120.5,18.5],[122.2,18.4],[122.2,16],[121.7,14.3],[124,13],[124.1,12.6],[122,13.2],[120.8,14.2],[120,16],[120.3,17.5]],
            [[122,7.5],[123.5,8.6],[125.5,9.8],[126.5,7.5],[126,6],[124.5,6.2],[122.5,6.8]],
            [[122,11.8],[123.5,11.5],[125,12.5],[125.5,10.5],[124.5,10],[123,9.2],[122.5,10.2]],
            [[130.9,34],[133,34.4],[135,34.6],[136.8,34.3],[139.8,35],[140.9,36.5],[141.5,38.5],[141.9,40.5],[140.3,41],[139.8,39.5],[139,38],[137.2,37],[136,36],[133,35.5],[131.5,34.8]],
            [[140,41.6],[141.5,42.3],[143.3,42],[145.5,43.3],[144,44.2],[141.8,45.4],[141.3,43.4],[140.3,43]],
            [[129.8,33],[131.5,33.8],[131.8,32],[131,31.2],[130.2,31.3],[129.8,32.5]],
            [[132.5,33.8],[134.5,34],[134.3,33.4],[133,32.8]],
            [[-5.5,50],[1.3,51.2],[1.7,52.8],[-.3,54],[-1.8,57.5],[-3,58.6],[-5.5,58.5],[-6,56.5],[-4.8,54.7],[-3,53.4],[-4.5,51.7]],
            [[-10,51.7],[-6,52],[-6,54.5],[-8,55.3],[-10,54]],
            [[-24,65.5],[-22,66.4],[-15,66.3],[-13.5,65],[-18,63.4],[-22.5,63.8]],
            [[172.7,-34.5],[174.5,-36],[178,-37.7],[176.8,-39.8],[175,-41.5],[174.5,-39.5],[173.2,-37.5]],
            [[172.7,-40.5],[174.3,-41.7],[172,-43.5],[170.5,-45.8],[167,-46],[166.5,-45],[170.5,-42.8]],
            [[49.3,-12],[50.4,-15.5],[49.5,-18],[47.2,-25],[45,-25.3],[43.7,-23.5],[44.3,-20.5],[44,-17],[46.5,-15.5]],
            [[79.8,9.5],[81.8,7.5],[81.2,6],[80,6],[79.8,7.5]],
            [[121,25],[122,24.5],[121,22],[120.2,22.8],[120.5,24.5]],
            [[-85,22],[-83,23],[-79,22.8],[-74.2,20.2],[-77.5,19.8],[-81,22.2]],
            [[-74.5,18.5],[-72,19.9],[-68.4,18.7],[-70,18.2],[-72,17.9]],
            [[-80,73.5],[-72,71.5],[-68,70],[-62,66.5],[-65,62.5],[-74,64.5],[-78,66],[-90,70.5],[-85,73]],
            [[144.7,-40.8],[148.3,-40.9],[148,-43],[146.5,-43.6]],
            [[142,54],[143.2,53],[143.5,49],[142.2,46],[142,50]],
            [[100.2,6.5],[102,6.2],[103.5,4.5],[104.2,1.4],[103,1.5],[101,3],[100,5]],
            [[102,12.5],[105,8.6],[106.8,10.3],[109.3,11.5],[108,15],[105,14],[102.5,13.5]],
            [[156,51],[158,52.5],[160,54.5],[162,56],[163.5,59],[160,61],[157,60.5],[156,57],[155.8,54]],
            [[5,58.5],[5.5,62],[10,64.5],[14,68],[18,70],[25,71],[30,70],[29,67],[25,65],[21.5,63],[17.5,62],[19,60],[17,57.5],[14,55.5],[12.5,56],[11,59],[8,58]]
        ];
        const inPoly = (lon, lat, P) => {
            let c = false;
            for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
                const xi = P[i][0], yi = P[i][1], xj = P[j][0], yj = P[j][1];
                if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) c = !c;
            }
            return c;
        };
        const hue2 = h => h < .5 ? [139 + 97 * h * 2, 92 - 20 * h * 2, 246 - 93 * h * 2] : [236 + 15 * (h - .5) * 2, 72 + 74 * (h - .5) * 2, 153 - 93 * (h - .5) * 2];
        const hue = h => h < .5
            ? [34 + 105 * h * 2, 211 - 119 * h * 2, 238 + 8 * h * 2]
            : [139 + 97 * (h - .5) * 2, 92 - 20 * (h - .5) * 2, 246 - 93 * (h - .5) * 2];
        const land = [];
        for (let lat = -80; lat <= 82; lat += 4) {
            const n = Math.max(1, Math.round(95 * Math.cos(lat * D2R)));
            for (let k = 0; k < n; k++) {
                const lon = -180 + 360 * k / n;
                if (polys.some(P => inPoly(lon, lat, P))) {
                    const c = hue((lon + 180) / 360).map(v => v | 0);
                    const c2 = hue2((lon + 180) / 360).map(v => v | 0);
                    land.push({ lat: lat * D2R, lon: lon * D2R, cd: 'rgb(' + c + ')', cl: 'rgb(' + c.map(v => (v * .55) | 0) + ')', cm: 'rgb(' + c2 + ')' });
                }
            }
        }
        const vec = (la, lo) => { la *= D2R; lo *= D2R; return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)]; };
        const cities = [[37.8,-122.4],[40.7,-74],[51.5,-.1],[48.9,2.3],[25.2,55.3],[19.1,72.9],[1.35,103.8],[-6.2,106.8],[35.7,139.7],[-33.9,151.2],[-23.5,-46.6],[6.5,3.4],[30,31.2],[55.7,37.6]].map(c => vec(c[0], c[1]));
        const newArc = () => {
            const pick = () => {
                if (!missile) return cities[(Math.random() * cities.length) | 0];
                const la = Math.asin(rnd(-.75, .75)), lo = -rot - .45 + rnd(-.95, .95);
                return [Math.cos(la) * Math.sin(lo), Math.sin(la), Math.cos(la) * Math.cos(lo)];
            };
            const a = pick(); let b, ang;
            do { b = pick(); ang = Math.acos(Math.max(-1, Math.min(1, a[0]*b[0] + a[1]*b[1] + a[2]*b[2]))); } while (b === a || (missile && (ang < .5 || ang > 1.7)));
            return { a, b, ang, t: missile ? -rnd(0, .3) : -rnd(0, 1), sp: rnd(.006, .012) };
        };
        const arcs = [], nArcs = missile ? 3 : 6;
        const booms = [], sparks = [];
        const FIRE = [[4.2, [[0, 'rgba(255,160,60,.35)'], [.5, 'rgba(217,70,239,.22)'], [1, 'rgba(217,70,239,0)']]], [2, [[0, 'rgba(255,200,90,.85)'], [.45, 'rgba(255,100,40,.6)'], [1, 'rgba(217,70,239,0)']]], [1, [[0, '#fff'], [.35, 'rgba(255,240,170,.9)'], [1, 'rgba(255,200,90,0)']]]];
        const mkBoom = v => ({ v, age: 0,
            st: Array.from({ length: 16 }, (_, i) => ({ s: (i + .5) / 16, ox: rnd(-1, 1), ph: rnd(0, TAU), z: rnd(.8, 1.25) })),
            cp: Array.from({ length: 38 }, (_, j) => ({ f: j / 38 * TAU + rnd(-.1, .1), rho: rnd(.35, 1), z: rnd(.8, 1.3) })),
            dp: Array.from({ length: 14 }, (_, k) => ({ th: k / 14 * TAU + rnd(-.2, .2), z: rnd(.8, 1.4), sp: rnd(.7, 1.1) })),
            fb: Array.from({ length: 12 }, () => ({ a: rnd(0, TAU), d: rnd(.2, 1), z: rnd(.8, 1.3) })) });
        const drawRocket = (hx, hy, ang, sc) => {
            ctx.save(); ctx.translate(hx, hy); ctx.rotate(ang); ctx.scale(sc, sc);
            // halo cahaya
            const g5 = ctx.createRadialGradient(0, 0, 0, 0, 0, 16);
            g5.addColorStop(0, 'rgba(140,235,255,.35)'); g5.addColorStop(1, 'rgba(140,235,255,0)');
            ctx.fillStyle = g5; ctx.beginPath(); ctx.arc(0, 0, 16, 0, TAU); ctx.fill();
            // api mesin berlapis (berkedip)
            const fl = 10 + 5 * Math.abs(Math.sin(tm * .7 + hx)) + rnd(0, 2.5);
            const flame = (len, wd, col) => { ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-11, -wd); ctx.quadraticCurveTo(-11 - len * .55, -wd * 1.25, -11 - len, 0); ctx.quadraticCurveTo(-11 - len * .55, wd * 1.25, -11, wd); ctx.closePath(); ctx.fill(); };
            flame(fl * 1.25, 3.4, 'rgba(217,70,239,.55)'); flame(fl, 2.8, 'rgba(255,110,40,.9)'); flame(fl * .7, 1.9, 'rgba(255,205,100,.95)'); flame(fl * .4, 1, '#fff');
            ctx.globalCompositeOperation = 'source-over';
            // nozzle
            ctx.fillStyle = '#343a63'; ctx.beginPath(); ctx.moveTo(-9, -2.4); ctx.lineTo(-11.6, -3.3); ctx.lineTo(-11.6, 3.3); ctx.lineTo(-9, 2.4); ctx.closePath(); ctx.fill();
            // sirip bergradasi pink -> ungu

    // --- Daftar efek: urutan = urutan saat logo Apple diklik --------------
    const FX = [
